# Local development infrastructure. Nothing here is used in production.
# Start: pnpm infra:up   Stop: pnpm infra:down
#
# Host ports are deliberately non-standard and bound to loopback, so DeX never
# collides with, or accidentally connects to, another project's Postgres/Redis/S3
# on the same machine. Keep them in step with .env.example.
name: dex

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: dex_admin
      POSTGRES_PASSWORD: dex_admin_dev
      POSTGRES_DB: dex
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dex_admin -d dex']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command:
      ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible storage. Cloudflare R2 replaces this in production (ADR-009).
  # Buckets are created by `pnpm infra:up` through packages/storage.
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: dex_rustfs
      RUSTFS_SECRET_KEY: dex_rustfs_dev
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '127.0.0.1:59000:9000'
      - '127.0.0.1:59001:9001'
    volumes:
      # Named volume, so the image's non-root user (UID 10001) can write on Linux too.
      - rustfs-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:58025:8025'
      - '127.0.0.1:51025:1025'

volumes:
  rustfs-data:
