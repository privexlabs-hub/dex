# Local development infrastructure. Nothing here is used in production.
# Start: pnpm infra:up   Stop: pnpm infra:down
name: dex

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: dex_admin
      POSTGRES_PASSWORD: dex_admin_dev
      POSTGRES_DB: dex
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dex_admin -d dex']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command:
      ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: dex_minio
      MINIO_ROOT_PASSWORD: dex_minio_dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 dex_minio dex_minio_dev &&
      mc mb --ignore-existing local/dex-media &&
      mc anonymous set none local/dex-media
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025'
      - '1025:1025'
